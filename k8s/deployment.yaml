apiVersion: apps/v1
kind: Deployment
metadata:
  name: developer-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: developer-portal
  template:
    metadata:
      labels:
        app: developer-portal
    spec:
      containers:
      - name: app
        image: ghcr.io/example/developer-portal:latest
        ports:
        - containerPort: 8080
        livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
